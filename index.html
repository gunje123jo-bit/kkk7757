<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업실적 현장입력</title>
  <style>
    body{font-family:Arial,'Noto Sans KR',sans-serif;margin:0;background:#f5f6f8;color:#111}.wrap{max-width:560px;margin:0 auto;padding:14px}h1{font-size:22px;margin:8px 0 14px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}label{display:block;font-weight:800;margin:10px 0 6px}input,select,button{width:100%;box-sizing:border-box;font-size:18px;padding:13px;border-radius:10px;border:1px solid #ccc;background:#fff}button{border:0;background:#1769e0;color:#fff;font-weight:800;margin-top:10px}button.gray{background:#555}button.red{background:#c62828}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tab{background:#e5e7eb;color:#111;border:1px solid #cbd5e1}.tab.active{background:#111827;color:#fff}.item{padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0;background:#fff;cursor:pointer}.item.active{border:2px solid #1769e0;background:#eef5ff}.no{font-weight:800;font-size:19px}.sub{font-size:14px;color:#555;margin-top:4px;line-height:1.35}.msg{font-weight:800;margin-top:10px}.ok{color:#087b25}.err{color:#b00020}.doneHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.doneHead h2{font-size:18px;margin:0}.smallBtn{width:auto;font-size:14px;padding:8px 10px;margin:0;background:#555}.doneItem{padding:11px 0;border-bottom:1px solid #eee}.doneItem:last-child{border-bottom:0}.doneTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.doneNo{font-weight:800;font-size:17px}.doneQty{font-weight:800;color:#1769e0;font-size:18px;white-space:nowrap}.deleteBtn{font-size:14px;padding:8px 10px;width:auto;margin-top:8px;background:#c62828}.totalBox{margin-top:8px;padding:10px;border-radius:10px;background:#eef5ff;font-weight:800}.hide{display:none}.info{padding:10px;border-radius:10px;background:#f1f5f9;margin-top:8px;font-weight:700;line-height:1.5}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;padding:10px;border-radius:10px;font-weight:800;line-height:1.45;margin-top:8px}.specList{display:flex;flex-direction:column;gap:8px;margin-top:10px}.specRow{border:1px solid #ddd;border-radius:12px;padding:10px;background:#fff}.specTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.specName{font-size:21px;font-weight:900}.specMeta{font-size:13px;color:#555;line-height:1.35;margin-top:3px}.specCnt{background:#eef5ff;border:1px solid #bfdbfe;border-radius:999px;padding:5px 9px;font-size:13px;font-weight:900;color:#1769e0;white-space:nowrap}.qtyBtns{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.qtyBtn{margin:0;padding:12px 0;background:#111827;color:#fff;border-radius:10px;font-size:19px}.qtyBtn:disabled{opacity:.55}.hogiBox{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:10px}
  </style>
</head>
<body>
<div class="wrap">
  <h1>작업실적 현장입력</h1>

  <div class="card"><label>입력 구분</label><div class="tabs"><button type="button" id="tabFinish" class="tab active" onclick="setMode('finish')">완성파트</button><button type="button" id="tabJe" class="tab" onclick="setMode('je')">제관파트</button></div></div>

  <div class="card"><div class="row2"><div><label>작업일자</label><input type="date" id="workDate"></div><div><label>작업자</label><select id="worker"><option value="">작업자 선택</option></select></div></div><div class="sub">선택한 작업일자 기준으로 실적이 저장됩니다.</div></div>

  <div id="finishArea"><div class="card"><label>품목번호</label><input id="itemNoInput" inputmode="numeric" autocomplete="off" placeholder="품목번호 입력 또는 검색"><div id="items" class="sub">작업자를 먼저 선택하세요.</div></div><div class="card"><label>수량</label><input type="number" id="qty" min="1" inputmode="numeric" placeholder="수량 입력"><button onclick="saveFinish()">입력 완료</button><button class="gray" onclick="resetFinish()">입력칸 초기화</button><div id="selectedText" class="sub">선택 품번: 없음</div><div id="msg" class="msg"></div></div></div>

  <div id="jeArea" class="hide"><div class="card"><div class="hogiBox"><label>호기수</label><input id="hogi" autocomplete="off" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="호기수 4자리 예: 0001"><div class="sub">호기수는 숫자 4자리만 입력하세요. 예: 0001, 0025, 1234</div></div><label>사양별 카운터</label><div class="notice">예: 25T 옆 3 클릭 = 25T 수량 3개 한 번에 입력. 잘못 입력한 건 아래 입력 완료 내역에서 삭제하세요.</div><div id="specs" class="specList"></div><div id="jeSelectedText" class="info">최근 입력: 없음</div><div id="jeMsg" class="msg"></div></div></div>

  <div class="card"><div class="doneHead"><h2>입력 완료 내역</h2><button class="smallBtn" onclick="loadResults()">새로고침</button></div><div class="sub">선택한 작업일자와 작업자 기준으로 표시됩니다.</div><div id="todayTotal" class="totalBox">합계: 0개</div><div id="todayResults" class="sub">작업자와 날짜를 선택하세요.</div></div>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxJH8OukdbBABynJG_Tgoqnmi5z-I2SWas15BWjUAYVWs30sDR8kYcO2vfQ0xxumLXm/exec';
let mode='finish', masterItems=[], jeSpecs=[], finishWorkers=[], jeWorkers=[], selected=null, jeCounts={}, savingJe=false;
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function jsonp(params,cb){const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);const s=document.createElement('script');window[callback]=data=>{cb(data);delete window[callback];s.remove();};s.onerror=()=>{showActiveMsg('통신 오류입니다.',false);delete window[callback];s.remove();};s.src=GAS_URL+'?'+new URLSearchParams({...params,callback}).toString();document.body.appendChild(s);}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function escJs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function setMode(m){mode=m;document.getElementById('tabFinish').classList.toggle('active',m==='finish');document.getElementById('tabJe').classList.toggle('active',m==='je');document.getElementById('finishArea').classList.toggle('hide',m!=='finish');document.getElementById('jeArea').classList.toggle('hide',m!=='je');fillWorkers();loadResults();}
function fillWorkers(){const sel=document.getElementById('worker');const old=sel.value;const list=mode==='je'?jeWorkers:finishWorkers;sel.innerHTML='<option value="">작업자 선택</option>'+list.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');if(list.includes(old))sel.value=old;}
function loadAll(){document.getElementById('workDate').value=localToday();jsonp({action:'master'},d=>{if(d.ok){masterItems=d.items||[];finishWorkers=d.workers||[];fillWorkers();renderItems();}});jsonp({action:'jeMaster'},d=>{if(d.ok){jeSpecs=d.specs||[];jeWorkers=d.workers||[];renderSpecs();}});}
function filteredMaster(){const w=document.getElementById('worker').value;return w?masterItems.filter(x=>x.worker===w):[];}
function renderItems(){selected=null;document.getElementById('selectedText').textContent='선택 품번: 없음';const w=document.getElementById('worker').value;const q=document.getElementById('itemNoInput').value.trim();const box=document.getElementById('items');if(mode!=='finish')return;if(!w){box.innerHTML='작업자를 먼저 선택하세요.';return;}if(!q){box.innerHTML='품목번호를 입력하세요.';return;}const list=filteredMaster().filter(x=>(x.itemNo+' '+x.itemName).includes(q)).slice(0,20);box.innerHTML=list.map(x=>`<div class="item" onclick="selectItem('${escJs(x.worker)}','${escJs(x.itemNo)}')"><div class="no">${esc(x.itemNo)}</div><div class="sub">${esc(x.itemName||'')}</div></div>`).join('')||'<div class="sub">일치하는 품번이 없습니다.</div>';}
function selectItem(worker,itemNo){selected=masterItems.find(x=>x.worker===worker&&x.itemNo===itemNo)||null;document.getElementById('selectedText').innerHTML=selected?`선택 품번: <b>${esc(selected.itemNo)}</b><br>${esc(selected.itemName||'')}`:'선택 품번: 없음';document.getElementById('items').innerHTML=selected?`<div class="item active"><div class="no">${esc(selected.itemNo)}</div><div class="sub">${esc(selected.itemName||'')}</div></div>`:'';}
function renderSpecs(){const box=document.getElementById('specs');box.innerHTML=jeSpecs.map(x=>{const cnt=jeCounts[x.spec]||0;return `<div class="specRow"><div class="specTop"><div><div class="specName">${esc(x.spec)}</div><div class="specMeta">ASSY ${esc(x.assyNo)} / SUB ${esc(x.subAssyNo||'-')}</div></div><div class="specCnt">오늘 ${cnt.toLocaleString()}개</div></div><div class="qtyBtns">${[1,2,3,4,5].map(n=>`<button type="button" class="qtyBtn" onclick="saveJeQty('${escJs(x.spec)}',${n})">${n}</button>`).join('')}</div></div>`;}).join('')||'<div class="sub">제관 사양이 없습니다.</div>';}
function saveFinish(){const workDate=document.getElementById('workDate').value, worker=document.getElementById('worker').value, typedNo=document.getElementById('itemNoInput').value.trim(), qty=document.getElementById('qty').value;if(!workDate)return showMsg('작업일자를 선택하세요.',false);if(!worker)return showMsg('작업자를 선택하세요.',false);if(!selected&&typedNo){const exact=masterItems.find(x=>x.worker===worker&&x.itemNo===typedNo);if(exact)selected=exact;}if(!selected)return showMsg('품목번호를 선택하세요.',false);if(!qty||Number(qty)<=0)return showMsg('수량을 입력하세요.',false);jsonp({action:'save',workDate,worker,part:selected.part||'',itemNo:selected.itemNo,itemName:selected.itemName||'',model:selected.model||'',process:selected.process||'',qty,device:'MOBILE',memo:''},d=>{if(d.ok){showMsg('입력 완료',true);resetFinish(false);loadResults();}else showMsg(d.message||'저장 실패',false);});}
function saveJeQty(spec,qty){const workDate=document.getElementById('workDate').value, worker=document.getElementById('worker').value, hogi=document.getElementById('hogi').value.trim();const item=jeSpecs.find(x=>x.spec===spec)||null;if(savingJe)return;if(!workDate)return showJeMsg('작업일자를 선택하세요.',false);if(!worker)return showJeMsg('작업자를 선택하세요.',false);if(!/^\d{4}$/.test(hogi))return showJeMsg('호기수는 숫자 4자리로 입력하세요. 예: 0001',false);if(!item)return showJeMsg('사양 정보를 찾을 수 없습니다.',false);savingJe=true;setQtyButtons(false);showJeMsg('저장 중...',true);jsonp({action:'saveJe',workDate,worker,hogi,spec:item.spec,assyNo:item.assyNo,subAssyNo:item.subAssyNo||'',qty,device:'MOBILE',memo:''},d=>{savingJe=false;setQtyButtons(true);if(d.ok){document.getElementById('jeSelectedText').innerHTML=`최근 입력: <b>${esc(item.spec)}</b> ${qty}개<br>호기수: <b>${esc(hogi)}</b><br>ASSY 품번: <b>${esc(item.assyNo)}</b><br>SUB ASSY 품번: <b>${esc(item.subAssyNo||'-')}</b>`;showJeMsg('입력 완료',true);loadResults();}else showJeMsg(d.message||'저장 실패',false);});}
function setQtyButtons(enabled){document.querySelectorAll('.qtyBtn').forEach(b=>b.disabled=!enabled);}
function loadResults(){const box=document.getElementById('todayResults'), totalBox=document.getElementById('todayTotal');const workDate=document.getElementById('workDate').value, worker=document.getElementById('worker').value;if(!workDate||!worker){totalBox.textContent='합계: 0개';box.innerHTML='작업자와 날짜를 선택하세요.';jeCounts={};renderSpecs();return;}box.innerHTML='<div class="sub">불러오는 중...</div>';const action=mode==='je'?'jeResults':'results';jsonp({action,startDate:workDate,endDate:workDate,worker},d=>{if(!d.ok){box.innerHTML='<div class="err">'+esc(d.message||'조회 실패')+'</div>';return;}const rows=d.rows||[];const qidx=mode==='je'?8:8;const total=rows.reduce((s,x)=>s+(Number((x.values||[])[qidx])||0),0);totalBox.textContent='합계: '+total.toLocaleString()+'개 / '+rows.length.toLocaleString()+'건';if(mode==='je'){jeCounts={};rows.forEach(x=>{const r=x.values||[];const spec=r[5]||'';jeCounts[spec]=(jeCounts[spec]||0)+(Number(r[8])||0);});renderSpecs();}box.innerHTML=rows.slice().reverse().map(x=>doneHtml(x)).join('')||'<div class="sub">입력 완료 내역이 없습니다.</div>';});}
function doneHtml(x){const r=x.values||[];const time=(r[0]||'').toString();const timeText=time.length>=16?time.substring(11,16):time;if(mode==='je'){return `<div class="doneItem"><div class="doneTop"><div><div class="doneNo">${esc(r[5]||'')}</div><div class="sub">호기수 ${esc(r[4]||'-')} / ASSY ${esc(r[6]||'')} / SUB ${esc(r[7]||'-')}</div><div class="sub">${esc(r[2]||'')} / ${esc(r[1]||'')} / ${esc(timeText)}</div></div><div class="doneQty">${Number(r[8]||0).toLocaleString()}개</div></div><button class="deleteBtn" onclick="deleteRow(${x.rowNo})">삭제</button></div>`;}return `<div class="doneItem"><div class="doneTop"><div><div class="doneNo">${esc(r[4]||'')}</div><div class="sub">${esc(r[5]||'')}</div><div class="sub">${esc(r[2]||'')} / ${esc(r[1]||'')} / ${esc(timeText)}</div></div><div class="doneQty">${Number(r[8]||0).toLocaleString()}개</div></div><button class="deleteBtn" onclick="deleteRow(${x.rowNo})">삭제</button></div>`;}
function deleteRow(rowNo){if(!confirm('이 입력 내역을 삭제할까요?'))return;jsonp({action:'delete',rowNo,sheet:mode==='je'?'je':'finish'},d=>{if(d.ok){mode==='je'?showJeMsg('삭제 완료',true):showMsg('삭제 완료',true);loadResults();}else{mode==='je'?showJeMsg(d.message||'삭제 실패',false):showMsg(d.message||'삭제 실패',false);}});}
function resetFinish(clearMsg=true){selected=null;document.getElementById('itemNoInput').value='';document.getElementById('qty').value='';document.getElementById('selectedText').textContent='선택 품번: 없음';document.getElementById('items').innerHTML=document.getElementById('worker').value?'품목번호를 입력하세요.':'작업자를 먼저 선택하세요.';if(clearMsg)showMsg('',true);}
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
function showJeMsg(t,ok){const m=document.getElementById('jeMsg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
function showActiveMsg(t,ok){mode==='je'?showJeMsg(t,ok):showMsg(t,ok);}
document.getElementById('itemNoInput').addEventListener('input',renderItems);document.getElementById('hogi').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);});document.getElementById('worker').addEventListener('change',()=>{resetFinish(false);loadResults();});document.getElementById('workDate').addEventListener('change',loadResults);loadAll();
</script>
</body>
</html>
