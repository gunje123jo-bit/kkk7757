<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업실적 현장입력</title>
  <style>
    body{font-family:Arial,'Noto Sans KR',sans-serif;margin:0;background:#f5f6f8;color:#111}.wrap{max-width:620px;margin:0 auto;padding:14px}h1{font-size:22px;margin:8px 0 14px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}label{display:block;font-weight:800;margin:10px 0 6px}input,select,button{width:100%;box-sizing:border-box;font-size:18px;padding:13px;border-radius:10px;border:1px solid #ccc;background:#fff}button{border:0;background:#1769e0;color:#fff;font-weight:800;margin-top:10px}button.gray{background:#555}button.red{background:#c62828}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.tab{background:#e5e7eb;color:#111;border:1px solid #cbd5e1}.tab.active{background:#111827;color:#fff}.item{padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0;background:#fff;cursor:pointer}.item.active{border:2px solid #1769e0;background:#eef5ff}.no{font-weight:800;font-size:19px}.sub{font-size:14px;color:#555;margin-top:4px;line-height:1.35}.msg{font-weight:800;margin-top:10px}.ok{color:#087b25}.err{color:#b00020}.doneHead{display:flex;justify-content:space-between;align-items:center;gap:8px}.doneHead h2{font-size:18px;margin:0}.smallBtn{width:auto;font-size:14px;padding:8px 10px;margin:0;background:#555}.doneItem{padding:11px 0;border-bottom:1px solid #eee}.doneItem:last-child{border-bottom:0}.doneTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.doneNo{font-weight:800;font-size:17px}.doneQty{font-weight:800;color:#1769e0;font-size:18px;white-space:nowrap}.deleteBtn{font-size:14px;padding:8px 10px;width:auto;margin-top:8px;background:#c62828}.totalBox{margin-top:8px;padding:10px;border-radius:10px;background:#eef5ff;font-weight:800}.hide{display:none}.info{padding:10px;border-radius:10px;background:#f1f5f9;margin-top:8px;font-weight:700;line-height:1.5}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;padding:10px;border-radius:10px;font-weight:800;line-height:1.45;margin-top:8px}.specList{display:flex;flex-direction:column;gap:8px;margin-top:10px}.specRow{border:1px solid #ddd;border-radius:12px;padding:10px;background:#fff}.specTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.specName{font-size:21px;font-weight:900}.specMeta{font-size:13px;color:#555;line-height:1.35;margin-top:3px}.specCnt{background:#eef5ff;border:1px solid #bfdbfe;border-radius:999px;padding:5px 9px;font-size:13px;font-weight:900;color:#1769e0;white-space:nowrap}.qtyBox{display:grid;grid-template-columns:74px 1fr;gap:6px;margin-top:0}.qtySelect{font-size:18px;padding:11px;border:2px solid #cbd5e1;border-radius:10px;text-align:center;font-weight:900;background:#fff}.qtyBtn{margin:0;padding:11px 0;background:#111827;color:#fff;border-radius:10px;font-size:18px}.qtyBtn:disabled{opacity:.55}.specInputRow{display:grid;grid-template-columns:1fr 132px;gap:8px;align-items:start}.hogiInput{font-size:18px;padding:11px;border:2px solid #cbd5e1;border-radius:10px;text-align:center;font-weight:900;letter-spacing:1px}.hogiLabel{font-size:13px;font-weight:900;margin:0 0 4px;color:#374151}.specTitleLine{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  </style>
</head>
<body>
<div class="wrap">
  <h1>작업실적 현장입력</h1>

  <div class="card"><label>입력 구분</label><div class="tabs"><button type="button" id="tabFinish" class="tab active" onclick="setMode('finish')">완성파트</button><button type="button" id="tabJe" class="tab" onclick="setMode('je')">제관파트</button><button type="button" id="tabWeld" class="tab" onclick="setMode('weld')">용접파트</button></div></div>

  <div class="card"><div class="row2"><div><label>작업일자</label><input type="date" id="workDate"></div><div><label>작업자</label><select id="worker"><option value="">작업자 선택</option></select></div></div><div class="sub">선택한 작업일자 기준으로 실적이 저장됩니다.</div></div>

  <div id="finishArea"><div class="card"><label>품목번호</label><input id="itemNoInput" inputmode="numeric" autocomplete="off" placeholder="품목번호 입력 또는 검색"><div id="items" class="sub">작업자를 먼저 선택하세요.</div></div><div class="card"><label>수량</label><input type="number" id="qty" min="1" inputmode="numeric" placeholder="수량 입력"><button onclick="saveFinish()">입력 완료</button><button class="gray" onclick="resetFinish()">입력칸 초기화</button><div id="selectedText" class="sub">선택 품번: 없음</div><div id="msg" class="msg"></div></div></div>

  <div id="jeArea" class="hide"><div class="card"><label>제관 사양 입력</label><div class="notice">각 사양 옆에 호기수 4자리를 입력하고, 수량은 선택칸에서 1 / 2 / 3 중 하나를 선택한 뒤 입력을 누르세요.</div><div id="specs" class="specList"></div><div id="jeSelectedText" class="info">최근 입력: 없음</div><div id="jeMsg" class="msg"></div></div></div>

  <div id="weldArea" class="hide"><div class="card"><label>용접 품번 / 공정명</label><input id="weldSearch" autocomplete="off" placeholder="품번 또는 공정명 검색"><div id="weldItems" class="sub">작업자를 먼저 선택하세요.</div></div><div class="card"><label>수량</label><input type="number" id="weldQty" min="1" inputmode="numeric" placeholder="수량 입력"><button onclick="saveWeld()">입력 완료</button><button class="gray" onclick="resetWeld()">입력칸 초기화</button><div id="weldSelectedText" class="sub">선택 용접: 없음</div><div id="weldMsg" class="msg"></div></div></div>

  <div class="card"><div class="doneHead"><h2>입력 완료 내역</h2><button class="smallBtn" onclick="loadResults()">새로고침</button></div><div class="sub">선택한 작업일자와 작업자 기준으로 표시됩니다.</div><div id="todayTotal" class="totalBox">합계: 0개</div><div id="todayResults" class="sub">작업자와 날짜를 선택하세요.</div></div>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxJH8OukdbBABynJG_Tgoqnmi5z-I2SWas15BWjUAYVWs30sDR8kYcO2vfQ0xxumLXm/exec';
let mode='finish', masterItems=[], jeSpecs=[], weldItems=[], finishWorkers=[], jeWorkers=[], weldWorkers=[], selected=null, selectedWeld=null, jeCounts={}, savingJe=false;
const JE_FALLBACK_SPECS=[{spec:'25T',assyNo:'8165204',subAssyNo:'8165198',memo:'',worker:'김동안'},{spec:'25S',assyNo:'8165202',subAssyNo:'8165198',memo:'',worker:'배인환'},{spec:'20T',assyNo:'8165200',subAssyNo:'8165198',memo:'',worker:'박창수'},{spec:'20S',assyNo:'8165197',subAssyNo:'8165198',memo:'',worker:'이상민'},{spec:'18T',assyNo:'8168195',subAssyNo:'8165185',memo:'',worker:''},{spec:'18S',assyNo:'8165193',subAssyNo:'8165185',memo:'',worker:''},{spec:'15T',assyNo:'8165191',subAssyNo:'8165185',memo:'',worker:''},{spec:'15S',assyNo:'8165189',subAssyNo:'8165185',memo:'',worker:''},{spec:'14T',assyNo:'8165187',subAssyNo:'8165185',memo:'',worker:''},{spec:'14S',assyNo:'8165184',subAssyNo:'8165185',memo:'',worker:''},{spec:'13T',assyNo:'8165130',subAssyNo:'8165124',memo:'',worker:''},{spec:'13S',assyNo:'8165124',subAssyNo:'8165124',memo:'',worker:''},{spec:'10T',assyNo:'8165126',subAssyNo:'8165124',memo:'',worker:''},{spec:'10S',assyNo:'8165123',subAssyNo:'8165124',memo:'',worker:''},{spec:'기타',assyNo:'55714346',subAssyNo:'',memo:'기타 선택 시 자동 표시',worker:''}];
const JE_FALLBACK_WORKERS=['김동안','배인환','박창수','이상민'];
function applyJeFallback(){if(!jeSpecs||jeSpecs.length===0)jeSpecs=JE_FALLBACK_SPECS;if(!jeWorkers||jeWorkers.length===0)jeWorkers=JE_FALLBACK_WORKERS;}
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function jsonp(params,cb){const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);const s=document.createElement('script');window[callback]=data=>{cb(data);delete window[callback];s.remove();};s.onerror=()=>{showActiveMsg('통신 오류입니다.',false);delete window[callback];s.remove();};s.src=GAS_URL+'?'+new URLSearchParams({...params,callback}).toString();document.body.appendChild(s);}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function escJs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
function setMode(m){mode=m;if(m==='je')applyJeFallback();['Finish','Je','Weld'].forEach(k=>document.getElementById('tab'+k).classList.remove('active'));document.getElementById(m==='finish'?'tabFinish':m==='je'?'tabJe':'tabWeld').classList.add('active');document.getElementById('finishArea').classList.toggle('hide',m!=='finish');document.getElementById('jeArea').classList.toggle('hide',m!=='je');document.getElementById('weldArea').classList.toggle('hide',m!=='weld');fillWorkers();if(m==='je')renderSpecs();if(m==='weld')renderWeldItems();loadResults();}
function fillWorkers(){const sel=document.getElementById('worker');const old=sel.value;const list=mode==='je'?jeWorkers:mode==='weld'?weldWorkers:finishWorkers;sel.innerHTML='<option value="">작업자 선택</option>'+list.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('');if(list.includes(old))sel.value=old;}
function loadAll(){document.getElementById('workDate').value=localToday();jsonp({action:'master'},d=>{if(d.ok){masterItems=d.items||[];finishWorkers=d.workers||[];if(mode==='finish')fillWorkers();renderItems();}});jsonp({action:'jeMaster'},d=>{if(d.ok){jeSpecs=d.specs||[];jeWorkers=d.workers||[];}applyJeFallback();if(mode==='je')fillWorkers();renderSpecs();});jsonp({action:'weldMaster'},d=>{if(d.ok){weldItems=d.items||[];weldWorkers=d.workers||[];}if(mode==='weld')fillWorkers();renderWeldItems();});}
function filteredMaster(){const w=document.getElementById('worker').value;return w?masterItems.filter(x=>x.worker===w):[];}
function filteredWeld(){const w=document.getElementById('worker').value;return w?weldItems.filter(x=>x.worker===w):[];}
function renderItems(){selected=null;document.getElementById('selectedText').textContent='선택 품번: 없음';const w=document.getElementById('worker').value;const q=document.getElementById('itemNoInput').value.trim();const box=document.getElementById('items');if(mode!=='finish')return;if(!w){box.innerHTML='작업자를 먼저 선택하세요.';return;}if(!q){box.innerHTML='품목번호를 입력하세요.';return;}const list=filteredMaster().filter(x=>(x.itemNo+' '+x.itemName).includes(q)).slice(0,20);box.innerHTML=list.map(x=>`<div class="item" onclick="selectItem('${escJs(x.worker)}','${escJs(x.itemNo)}')"><div class="no">${esc(x.itemNo)}</div><div class="sub">${esc(x.itemName||'')}</div></div>`).join('')||'<div class="sub">일치하는 품번이 없습니다.</div>';}
function selectItem(worker,itemNo){selected=masterItems.find(x=>x.worker===worker&&x.itemNo===itemNo)||null;document.getElementById('selectedText').innerHTML=selected?`선택 품번: <b>${esc(selected.itemNo)}</b><br>${esc(selected.itemName||'')}`:'선택 품번: 없음';document.getElementById('items').innerHTML=selected?`<div class="item active"><div class="no">${esc(selected.itemNo)}</div><div class="sub">${esc(selected.itemName||'')}</div></div>`:'';}
function renderWeldItems(){selectedWeld=null;document.getElementById('weldSelectedText').textContent='선택 용접: 없음';const w=document.getElementById('worker').value;const q=document.getElementById('weldSearch').value.trim();const box=document.getElementById('weldItems');if(mode!=='weld')return;if(!w){box.innerHTML='작업자를 먼저 선택하세요.';return;}if(!q){box.innerHTML='품번 또는 공정명을 입력하세요.';return;}const list=filteredWeld().filter(x=>(x.itemNo+' '+x.itemName+' '+x.process+' '+x.displayName).includes(q)).slice(0,25);box.innerHTML=list.map(x=>`<div class="item" onclick="selectWeld('${escJs(x.worker)}','${escJs(x.inputKey)}')"><div class="no">${esc(x.displayName||x.itemNo+' / '+x.process)}</div><div class="sub">${esc(x.itemName||'')} / ${esc(x.model||'')}</div></div>`).join('')||'<div class="sub">일치하는 용접 품번/공정이 없습니다.</div>';}
function selectWeld(worker,inputKey){selectedWeld=weldItems.find(x=>x.worker===worker&&x.inputKey===inputKey)||null;document.getElementById('weldSelectedText').innerHTML=selectedWeld?`선택 용접: <b>${esc(selectedWeld.displayName||selectedWeld.itemNo+' / '+selectedWeld.process)}</b><br>${esc(selectedWeld.itemName||'')} / ${esc(selectedWeld.model||'')}`:'선택 용접: 없음';document.getElementById('weldItems').innerHTML=selectedWeld?`<div class="item active"><div class="no">${esc(selectedWeld.displayName||selectedWeld.itemNo+' / '+selectedWeld.process)}</div><div class="sub">${esc(selectedWeld.itemName||'')} / ${esc(selectedWeld.model||'')}</div></div>`:'';}
function renderSpecs(){const box=document.getElementById('specs');box.innerHTML=jeSpecs.map((x,i)=>{const cnt=jeCounts[x.spec]||0;return `<div class="specRow"><div class="specTop"><div><div class="specTitleLine"><span class="specName">${esc(x.spec)}</span><span class="specCnt">오늘 ${cnt.toLocaleString()}개</span></div><div class="specMeta">ASSY ${esc(x.assyNo)} / SUB ${esc(x.subAssyNo||'-')}</div></div></div><div class="specInputRow"><div><div class="hogiLabel">호기수 4자리</div><input id="hogi_${i}" class="hogiInput" autocomplete="off" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="0001"></div><div><div class="hogiLabel">수량 선택</div><div class="qtyBox"><select id="jeQty_${i}" class="qtySelect"><option value="1">1</option><option value="2">2</option><option value="3">3</option></select><button type="button" class="qtyBtn" onclick="saveJeQty('${escJs(x.spec)}',${i})">입력</button></div></div></div></div>`;}).join('')||'<div class="sub">제관 사양이 없습니다.</div>';}
function saveFinish(){const workDate=document.getElementById('workDate').value,worker=document.getElementById('worker').value,typedNo=document.getElementById('itemNoInput').value.trim(),qty=document.getElementById('qty').value;if(!workDate)return showMsg('작업일자를 선택하세요.',false);if(!worker)return showMsg('작업자를 선택하세요.',false);if(!selected&&typedNo){const exact=masterItems.find(x=>x.worker===worker&&x.itemNo===typedNo);if(exact)selected=exact;}if(!selected)return showMsg('품목번호를 선택하세요.',false);if(!qty||Number(qty)<=0)return showMsg('수량을 입력하세요.',false);jsonp({action:'save',workDate,worker,part:selected.part||'',itemNo:selected.itemNo,itemName:selected.itemName||'',model:selected.model||'',process:selected.process||'',qty,device:'MOBILE',memo:''},d=>{if(d.ok){showMsg('입력 완료',true);resetFinish(false);loadResults();}else showMsg(d.message||'저장 실패',false);});}
function saveWeld(){const workDate=document.getElementById('workDate').value,worker=document.getElementById('worker').value,typed=document.getElementById('weldSearch').value.trim(),qty=document.getElementById('weldQty').value;if(!workDate)return showWeldMsg('작업일자를 선택하세요.',false);if(!worker)return showWeldMsg('작업자를 선택하세요.',false);if(!selectedWeld&&typed){const exact=weldItems.find(x=>x.worker===worker&&(x.itemNo===typed||x.displayName===typed||x.inputKey===typed));if(exact)selectedWeld=exact;}if(!selectedWeld)return showWeldMsg('품번/공정명을 선택하세요.',false);if(!qty||Number(qty)<=0)return showWeldMsg('수량을 입력하세요.',false);jsonp({action:'saveWeld',workDate,worker,part:selectedWeld.part||'용접파트',itemNo:selectedWeld.itemNo,itemName:selectedWeld.itemName||'',model:selectedWeld.model||'',process:selectedWeld.process||'',qty,device:'MOBILE',memo:''},d=>{if(d.ok){showWeldMsg('입력 완료',true);resetWeld(false);loadResults();}else showWeldMsg(d.message||'저장 실패',false);});}
function saveJeQty(spec,idx){const workDate=document.getElementById('workDate').value,worker=document.getElementById('worker').value;const hogiEl=document.getElementById('hogi_'+idx),qtyEl=document.getElementById('jeQty_'+idx);const hogi=hogiEl?hogiEl.value.trim():'';const qty=qtyEl?qtyEl.value:'1';const item=jeSpecs.find(x=>x.spec===spec)||null;if(savingJe)return;if(!workDate)return showJeMsg('작업일자를 선택하세요.',false);if(!worker)return showJeMsg('작업자를 선택하세요.',false);if(!/^\d{4}$/.test(hogi)){if(hogiEl)hogiEl.focus();return showJeMsg('호기수는 숫자 4자리로 입력하세요. 예: 0001',false);}if(!['1','2','3'].includes(String(qty)))return showJeMsg('수량은 1, 2, 3 중에서 선택하세요.',false);if(!item)return showJeMsg('사양 정보를 찾을 수 없습니다.',false);savingJe=true;setQtyButtons(false);showJeMsg('저장 중...',true);jsonp({action:'saveJe',workDate,worker,hogi,spec:item.spec,assyNo:item.assyNo,subAssyNo:item.subAssyNo||'',qty,device:'MOBILE',memo:''},d=>{savingJe=false;setQtyButtons(true);if(d.ok){document.getElementById('jeSelectedText').innerHTML=`최근 입력: <b>${esc(item.spec)}</b> ${qty}개<br>호기수: <b>${esc(hogi)}</b><br>ASSY 품번: <b>${esc(item.assyNo)}</b><br>SUB ASSY 품번: <b>${esc(item.subAssyNo||'-')}</b>`;showJeMsg('입력 완료',true);loadResults();}else showJeMsg(d.message||'저장 실패',false);});}
function setQtyButtons(enabled){document.querySelectorAll('.qtyBtn').forEach(b=>b.disabled=!enabled);}
function loadResults(){const box=document.getElementById('todayResults'),totalBox=document.getElementById('todayTotal');const workDate=document.getElementById('workDate').value,worker=document.getElementById('worker').value;if(!workDate||!worker){totalBox.textContent='합계: 0개';box.innerHTML='작업자와 날짜를 선택하세요.';jeCounts={};if(mode==='je')renderSpecs();return;}box.innerHTML='<div class="sub">불러오는 중...</div>';const action=mode==='je'?'jeResults':mode==='weld'?'weldResults':'results';jsonp({action,startDate:workDate,endDate:workDate,worker},d=>{if(!d.ok){box.innerHTML='<div class="err">'+esc(d.message||'조회 실패')+'</div>';return;}const rows=d.rows||[];const total=rows.reduce((s,x)=>s+(Number((x.values||[])[8])||0),0);totalBox.textContent='합계: '+total.toLocaleString()+'개 / '+rows.length.toLocaleString()+'건';if(mode==='je'){jeCounts={};rows.forEach(x=>{const r=x.values||[];const spec=r[5]||'';jeCounts[spec]=(jeCounts[spec]||0)+(Number(r[8])||0);});renderSpecs();}box.innerHTML=rows.slice().reverse().map(x=>doneHtml(x)).join('')||'<div class="sub">입력 완료 내역이 없습니다.</div>';});}
function doneHtml(x){const r=x.values||[];const time=(r[0]||'').toString();const timeText=time.length>=16?time.substring(11,16):time;if(mode==='je')return `<div class="doneItem"><div class="doneTop"><div><div class="doneNo">${esc(r[5]||'')}</div><div class="sub">호기수 ${esc(r[4]||'-')} / ASSY ${esc(r[6]||'')} / SUB ${esc(r[7]||'-')}</div><div class="sub">${esc(r[2]||'')} / ${esc(r[1]||'')} / ${esc(timeText)}</div></div><div class="doneQty">${Number(r[8]||0).toLocaleString()}개</div></div><button class="deleteBtn" onclick="deleteRow(${x.rowNo})">삭제</button></div>`;if(mode==='weld')return `<div class="doneItem"><div class="doneTop"><div><div class="doneNo">${esc(r[4]||'')} / ${esc(r[7]||'')}</div><div class="sub">${esc(r[5]||'')} / ${esc(r[6]||'')}</div><div class="sub">${esc(r[2]||'')} / ${esc(r[1]||'')} / ${esc(timeText)}</div></div><div class="doneQty">${Number(r[8]||0).toLocaleString()}개</div></div><button class="deleteBtn" onclick="deleteRow(${x.rowNo})">삭제</button></div>`;return `<div class="doneItem"><div class="doneTop"><div><div class="doneNo">${esc(r[4]||'')}</div><div class="sub">${esc(r[5]||'')}</div><div class="sub">${esc(r[2]||'')} / ${esc(r[1]||'')} / ${esc(timeText)}</div></div><div class="doneQty">${Number(r[8]||0).toLocaleString()}개</div></div><button class="deleteBtn" onclick="deleteRow(${x.rowNo})">삭제</button></div>`;}
function deleteRow(rowNo){if(!confirm('이 입력 내역을 삭제할까요?'))return;jsonp({action:'delete',rowNo,sheet:mode==='je'?'je':mode==='weld'?'weld':'finish'},d=>{if(d.ok){showActiveMsg('삭제 완료',true);loadResults();}else showActiveMsg(d.message||'삭제 실패',false);});}
function resetFinish(clearMsg=true){selected=null;document.getElementById('itemNoInput').value='';document.getElementById('qty').value='';document.getElementById('selectedText').textContent='선택 품번: 없음';document.getElementById('items').innerHTML=document.getElementById('worker').value?'품목번호를 입력하세요.':'작업자를 먼저 선택하세요.';if(clearMsg)showMsg('',true);}
function resetWeld(clearMsg=true){selectedWeld=null;document.getElementById('weldSearch').value='';document.getElementById('weldQty').value='';document.getElementById('weldSelectedText').textContent='선택 용접: 없음';document.getElementById('weldItems').innerHTML=document.getElementById('worker').value?'품번 또는 공정명을 입력하세요.':'작업자를 먼저 선택하세요.';if(clearMsg)showWeldMsg('',true);}
function showMsg(t,ok){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
function showJeMsg(t,ok){const m=document.getElementById('jeMsg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
function showWeldMsg(t,ok){const m=document.getElementById('weldMsg');m.textContent=t;m.className='msg '+(ok?'ok':'err');}
function showActiveMsg(t,ok){mode==='je'?showJeMsg(t,ok):mode==='weld'?showWeldMsg(t,ok):showMsg(t,ok);}
document.getElementById('itemNoInput').addEventListener('input',renderItems);document.getElementById('weldSearch').addEventListener('input',renderWeldItems);document.getElementById('specs').addEventListener('input',e=>{if(e.target.classList.contains('hogiInput'))e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);});document.getElementById('worker').addEventListener('change',()=>{resetFinish(false);resetWeld(false);loadResults();});document.getElementById('workDate').addEventListener('change',loadResults);loadAll();
</script>
</body>
</html>
