<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업실적 조회</title>
  <style>
    body{font-family:Arial,'Noto Sans KR',sans-serif;margin:0;background:#f5f6f8;color:#111}
    header{background:#111827;color:#fff;padding:16px 18px;font-size:22px;font-weight:800}
    .wrap{padding:14px;max-width:1000px;margin:0 auto}
    .box{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    label{font-size:14px;font-weight:800;display:block;margin-bottom:6px}
    input[type=date]{font-size:18px;padding:10px;border:1px solid #bbb;border-radius:10px;width:210px;max-width:100%;box-sizing:border-box}
    button{font-size:16px;padding:11px 14px;margin:4px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}
    button.gray{background:#555}
    button.off{background:#888}
    .row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
    .muted{color:#666;font-size:13px;margin-top:8px;line-height:1.45}
    table{width:100%;border-collapse:collapse;background:#fff;font-size:15px}
    th,td{border:1px solid #ddd;padding:9px;text-align:left;white-space:nowrap}
    th{background:#eee;font-weight:800}
    td.qty{text-align:right;font-weight:800}
    .tableWrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
    .summary{font-size:17px;font-weight:800}
    .empty{padding:18px;text-align:center;color:#666;background:#fff}
  </style>
</head>
<body>
<header>작업실적 조회</header>
<div class="wrap">
  <div class="box">
    <div class="row">
      <div>
        <label for="workDate">조회일자</label>
        <input id="workDate" type="date">
      </div>
      <button onclick="loadResults(false)">조회</button>
      <button class="gray" onclick="setTodayAndLoad()">오늘</button>
      <button onclick="downloadCsv()">CSV 다운로드</button>
      <button id="notifyBtn" class="off" onclick="toggleNotify()">PC 알림 켜기</button>
    </div>
    <div class="muted">선택한 작업일자 기준으로 입력일시 / 작업자 / 품명 / 수량만 표시합니다. 알림은 이 PC에서 이 화면을 열어둔 상태에서만 작동합니다.</div>
  </div>

  <div id="summary" class="box summary">조회 대기</div>
  <div class="tableWrap">
    <table id="tbl"></table>
  </div>
</div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxJH8OukdbBABynJG_Tgoqnmi5z-I2SWas15BWjUAYVWs30sDR8kYcO2vfQ0xxumLXm/exec';
let rows = [];
let notifyOn = false;
let lastKey = '';
let timer = null;
const viewHeaders = ['입력일시','작업자','품명','수량'];

function localDateString(d=new Date()){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function setTodayAndLoad(){
  document.getElementById('workDate').value = localDateString();
  loadResults(false);
}

function jsonp(params, cb){
  const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);
  const script=document.createElement('script');
  window[callback]=data=>{cb(data); delete window[callback]; script.remove();};
  script.onerror=()=>{alert('조회 실패: Apps Script 연결을 확인하세요.'); delete window[callback]; script.remove();};
  script.src=GAS_URL+'?'+new URLSearchParams({...params,callback}).toString();
  document.body.appendChild(script);
}

function loadResults(silent){
  const d = document.getElementById('workDate').value;
  if(!d){ alert('조회일자를 선택하세요.'); return; }
  if(!silent) document.getElementById('summary').textContent='조회 중...';
  jsonp({action:'results', startDate:d, endDate:d}, res=>{
    if(!res.ok){alert(res.message || '조회 실패');return}
    const oldKey = lastKey;
    rows=(res.rows||[]).slice().reverse();
    lastKey = makeKey(rows);
    render();
    if(silent && notifyOn && oldKey && oldKey !== lastKey){
      const latest = rows[0] || [];
      showPcNotice('작업실적 입력 확인', `${latest[2] || ''} / ${latest[5] || latest[4] || ''} / ${latest[8] || ''}개`);
    }
  });
}

function makeKey(list){
  return list.map(r=>[r[0],r[1],r[2],r[4],r[8]].join('|')).join('\n');
}

function toViewRow(r){
  return [
    r[0] || '',   // 입력일시
    r[2] || '',   // 작업자
    r[5] || r[4] || '',   // 품명, 없으면 품번
    r[8] || ''    // 수량
  ];
}

function render(){
  const total = rows.reduce((s,r)=>s+Number(r[8]||0),0);
  const d = document.getElementById('workDate').value;
  document.getElementById('summary').innerHTML=`${escapeHtml(d)} 조회 건수: <b>${rows.length}</b>건 / 수량 합계: <b>${total}</b>`;
  if(!rows.length){
    document.getElementById('tbl').innerHTML='<tr>'+viewHeaders.map(h=>`<th>${h}</th>`).join('')+'</tr><tr><td colspan="4" class="empty">조회된 입력 실적이 없습니다.</td></tr>';
    return;
  }
  const body = rows.map(r=>{
    const v=toViewRow(r);
    return '<tr>'+v.map((x,i)=>`<td class="${i===3?'qty':''}">${escapeHtml(x)}</td>`).join('')+'</tr>';
  }).join('');
  document.getElementById('tbl').innerHTML='<tr>'+viewHeaders.map(h=>`<th>${h}</th>`).join('')+'</tr>'+body;
}

function escapeHtml(v){
  return String(v ?? '').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function downloadCsv(){
  const d = document.getElementById('workDate').value || localDateString();
  const csv=[viewHeaders,...rows.map(toViewRow)].map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='작업실적_'+d+'.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

async function toggleNotify(){
  const btn = document.getElementById('notifyBtn');
  if(!('Notification' in window)){
    alert('이 브라우저는 PC 알림을 지원하지 않습니다.');
    return;
  }
  if(!notifyOn){
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){
      alert('브라우저 알림 허용이 필요합니다.');
      return;
    }
    notifyOn = true;
    btn.textContent = 'PC 알림 켜짐';
    btn.classList.remove('off');
    loadResults(true);
    timer = setInterval(()=>loadResults(true), 30000);
  } else {
    notifyOn = false;
    btn.textContent = 'PC 알림 켜기';
    btn.classList.add('off');
    if(timer) clearInterval(timer);
    timer = null;
  }
}

function showPcNotice(title, body){
  try { new Notification(title, { body }); } catch(e) {}
}

document.getElementById('workDate').value = localDateString();
loadResults(false);
</script>
</body>
</html>
