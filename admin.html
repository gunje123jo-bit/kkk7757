<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작업실적 조회</title>
  <style>
    body{font-family:Arial,'Noto Sans KR',sans-serif;margin:0;background:#f5f6f8;color:#111}header{background:#111827;color:#fff;padding:12px 16px;font-size:22px;font-weight:900}.wrap{max-width:1180px;margin:0 auto;padding:14px}.box{background:#fff;border-radius:12px;margin-bottom:10px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.08)}label{font-weight:800;display:block;margin-bottom:5px}input,button{font-size:16px;padding:10px;border-radius:8px;border:1px solid #ccc}button{border:0;background:#1769e0;color:white;font-weight:800;margin-right:6px;cursor:pointer}button.gray{background:#666}.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.muted{color:#555;font-size:13px;margin-top:8px}.partBox{display:flex;gap:10px;flex-wrap:wrap}.part{background:#e5e7eb;color:#111;border:1px solid #cbd5e1}.part.active{background:#111827;color:#fff}.smTypeBtn{background:#e5e7eb!important;color:#111!important;border:2px solid #cbd5e1!important}.smTypeBtn.active{background:#1769e0!important;color:#fff!important;border-color:#0b5ed7!important;box-shadow:0 0 0 3px rgba(23,105,224,.22)}.smQuickResults{display:grid;gap:7px;margin-top:8px;max-width:620px}.smQuickHint{padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;color:#475569;font-weight:800}.smQuickCard{display:block;width:100%;margin:0;text-align:left;background:#f8fafc;color:#111;border:2px solid #cbd5e1;border-radius:10px;padding:10px 12px}.smQuickCard:hover{border-color:#1769e0}.smQuickCard.active{background:#eaf2ff;color:#073b86;border-color:#1769e0;box-shadow:0 0 0 2px rgba(23,105,224,.14)}.smQuickModel{font-size:15px;color:#475569;margin-bottom:3px}.smQuickPart{font-size:19px;font-weight:900}.smQuickMeta{font-size:13px;color:#475569;margin-top:3px}.saveToast{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%) scale(.94);z-index:10000;background:#087b25;color:#fff;border-radius:16px;padding:22px 36px;font-size:26px;font-weight:900;box-shadow:0 12px 36px rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease}.saveToast.show{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}.pill{display:inline-block;background:#eef5ff;border:1px solid #bfdbfe;color:#0b5ed7;border-radius:999px;padding:4px 10px;font-weight:900;margin-left:6px}.summary{font-weight:900;font-size:18px}.tableWrap{overflow:auto;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}table{border-collapse:collapse;width:100%;min-width:980px}th,td{border:1px solid #ddd;padding:10px;text-align:left;white-space:nowrap}th{background:#eee;font-weight:900}.qty{text-align:right;font-weight:900}.del{background:#e11d2e;color:#fff;border-radius:8px;padding:8px 10px}.subBox{display:flex;gap:8px;flex-wrap:wrap}.subCard{padding:8px 12px;background:#f1f5f9;border:1px solid #dbe3ee;border-radius:8px;font-weight:900}.off{background:#888}.copyBtn{background:#0f766e;color:#fff;border-radius:7px;padding:6px 8px;font-size:13px;font-weight:900;margin-right:8px}.copyBtn.done{background:#16a34a}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:14px 18px;border-radius:10px;font-weight:900;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:9999;display:none}.itemCell{font-weight:900}.hide{display:none}
    .admChip{display:inline-flex;align-items:center;gap:6px;background:#dbeafe;border:1px solid #93c5fd;color:#1e3a8a;border-radius:999px;padding:5px 6px 5px 12px;font-weight:700}.admChip button{width:auto;min-height:0;margin:0;padding:0 6px;background:transparent;color:#1e3a8a;border:0;font-size:18px;line-height:1;cursor:pointer}.admAdd{width:auto!important;padding:6px 12px!important;background:#fff!important;color:#111!important;border:1px solid #cbd5e1!important;border-radius:8px;cursor:pointer}.admSmall{width:auto!important;padding:5px 10px!important;font-size:13px!important}
  </style>
</head>
<body>
<header>작업실적 조회</header>
<div class="wrap">
  <div class="box"><div class="row"><div><label for="workDate">조회일자</label><input id="workDate" type="date"></div><button type="button" onclick="loadResults(false)">조회</button><button type="button" class="gray" onclick="setTodayAndLoad()">오늘</button><button type="button" onclick="downloadCsv()">CSV 다운로드</button><button type="button" id="notifyBtn" class="off" onclick="toggleNotify()">PC 알림 켜기</button></div><div class="muted">날짜 선택 후 카테고리를 클릭하면 해당 실적만 표시됩니다. 잘못 입력한 건 PC 화면에서도 삭제할 수 있습니다.</div></div>
  <div class="box"><div class="row" style="justify-content:space-between"><div class="partTitle">실적 입력</div><button type="button" id="pcInputBtn" onclick="toggleInputPanel()">PC 입력</button></div>
    <div id="inputPanel" class="hide">
      <div class="partBox" style="margin:10px 0"><button type="button" id="inBtnFinish" class="part active" onclick="selectInputPart('finish')">완성파트</button><button type="button" id="inBtnJe" class="part" onclick="selectInputPart('je')">제관파트</button><button type="button" id="inBtnWeld" class="part" onclick="selectInputPart('weld')">용접파트</button><button type="button" id="inBtnSc" class="part" onclick="selectInputPart('sc')">SC파트</button><button type="button" id="inBtnAsm" class="part" onclick="selectInputPart('asm')">조립파트</button><button type="button" id="inBtnDojang" class="part" onclick="selectInputPart('dojang')">도장파트</button><button type="button" id="inBtnPress" class="part" onclick="selectInputPart('press')">프레스파트</button><button type="button" id="inBtnSm" class="part" onclick="selectInputPart('sm')">SM파트</button><button type="button" id="inBtnSm2" class="part" onclick="selectInputPart('sm2')">SM2파트</button></div>
      <div class="row"><div><label>작업일자</label><input id="inWorkDate" type="date"></div><div><label>작업자</label><span id="smSupportWrap" class="hide"><label><input type="checkbox" id="smSupport" onchange="fillAdminWorkers(inputPart)"> 지원 (SM2)</label></span><select id="inWorker"><option value="">작업자 선택</option></select></div></div>
      <div id="asmAdminBox" class="hide" style="margin-top:8px"><label id="asmAdminLabel">조립 조 선택 / 파트원</label><div id="asmAdminTeams" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0"></div><div style="max-width:420px"><input id="inAsmSearch" autocomplete="off" placeholder="작업자 이름 검색 (예: 서우)" oninput="renderAdminAsmSearch()"><div id="inAsmResults" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"></div></div><label style="margin-top:8px">조원 <span id="inAsmCount" class="sub"></span></label><div id="inAsmChips" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"></div><input id="inAsmMembers" type="hidden"><div id="asmAdminEditBox" class="hide" style="margin-top:8px"></div></div>
      <div id="inFinishForm" class="row" style="margin-top:8px">
        <div style="flex:1;min-width:220px"><label>품번 검색</label><input id="inFinishItem" list="inFinishList" placeholder="품번 입력 또는 목록에서 선택" autocomplete="off"><datalist id="inFinishList"></datalist></div>
        <div><label>수량</label><input id="inFinishQty" type="number" min="1" style="width:100px"></div>
        <div><button type="button" onclick="saveAdminFinish()">저장</button></div>
      </div>
      <div id="inJeForm" class="row hide" style="margin-top:8px">
        <div style="min-width:240px"><label>사양(김동안) / SUB 크기·JEC 차수</label><select id="inJeSpec" onchange="onJeSpecChange()"></select></div>
        <div id="inJeProcWrap"><label>SUB 공정</label><select id="inJeProc"></select></div>
        <div><label>호기수(4자리, 김동안 ASSY만)</label><input id="inJeHogi" maxlength="4" style="width:110px" placeholder="김동안 외 비움"></div>
        <div><label>수량</label><input id="inJeQty" type="number" min="1" value="1" style="width:80px"></div>
        <div><button type="button" onclick="saveAdminJe()">저장</button></div>
      </div>
      <div id="inProcForm" class="row hide" style="margin-top:8px">
        <div style="flex:1;min-width:260px"><div id="adminModelBox" class="hide"><label>기종 선택 (선택 안 해도 됩니다)</label><div id="adminModels" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px"></div></div><label>품번/공정 검색</label><div id="smAdminSearch" class="hide"><div style="display:flex;gap:8px;margin-bottom:8px"><button type="button" id="smTypeNum" style="width:auto" class="tab smTypeBtn active" aria-pressed="true" onclick="setSmPrefix('')">일반</button><button type="button" id="smTypeFP" style="width:auto" class="tab smTypeBtn" aria-pressed="false" onclick="setSmPrefix('FP')">FP</button><button type="button" id="smTypeFB" style="width:auto" class="tab smTypeBtn" aria-pressed="false" onclick="setSmPrefix('FB')">FB</button></div><label>관리번호 검색</label><input id="smAdminNumber" inputmode="numeric" placeholder="관리번호 숫자 입력 (예: 22)" oninput="renderSmAdminSearch()"><div id="smAdminResults" class="smQuickResults"><div class="smQuickHint">관리번호를 입력하면 모델과 품번이 바로 표시됩니다.</div></div><select id="smAdminChoice" class="hide" onchange="selectSmAdminChoice()"><option value=""></option></select><label style="margin-top:12px">품번 검색</label><input id="smAdminPartNumber" autocomplete="off" placeholder="품번 입력 (예: 14681932-SM)" oninput="renderSmAdminPartSearch()"><div><select id="smAdminPartChoice" onchange="selectSmAdminPartChoice()" style="max-width:100%;padding:10px;margin-top:8px"><option value="">품번을 입력하세요.</option></select></div></div><input id="inProcItem" list="inProcList" placeholder="목록에서 품번/공정을 선택하세요" autocomplete="off"><datalist id="inProcList"></datalist></div>
        <div><label>수량</label><input id="inProcQty" type="number" min="1" style="width:100px"></div>
        <div><button type="button" onclick="saveAdminProc()">저장</button></div>
      </div>
      <div id="inMsg" class="muted"></div>
    </div>
  </div>
  <div class="box"><div class="partTitle">카테고리 <span id="selectedPartLabel" class="pill">전체</span></div><div class="partBox"><button type="button" id="btnAll" class="part active" onclick="selectPart('all')">전체</button><button type="button" id="btnFinish" class="part" onclick="selectPart('finish')">완성파트</button><button type="button" id="btnJe" class="part" onclick="selectPart('je')">제관파트</button><button type="button" id="btnWeld" class="part" onclick="selectPart('weld')">용접파트</button><button type="button" id="btnSc" class="part" onclick="selectPart('sc')">SC파트</button><button type="button" id="btnAsm" class="part" onclick="selectPart('asm')">조립파트</button><button type="button" id="btnDojang" class="part" onclick="selectPart('dojang')">도장파트</button><button type="button" id="btnPress" class="part" onclick="selectPart('press')">프레스파트</button><button type="button" id="btnSm" class="part" onclick="selectPart('sm')">SM파트</button><button type="button" id="btnSm2" class="part" onclick="selectPart('sm2')">SM2파트</button></div></div>
  <div id="jeSummaryBox" class="box" style="display:none"><div class="partTitle">제관 SUB ASSY별 수량</div><div id="jeSubSummary" class="subBox"></div></div>
  <div id="summary" class="box summary">조회 대기</div>
  <div class="tableWrap"><table id="tbl"></table></div>
</div>
<div id="copyToast" class="toast">품번 복사 완료</div>
<div id="adminSaveToast" class="saveToast" role="status" aria-live="polite">입력되었습니다</div>
<script>

let smPrefix='';
function smMatches(item,q){
 const n=String(q||'').trim();if(!/^\d+$/.test(n))return false;
 const code=String(item.managementNo||'').toUpperCase().replace(/[\s-]/g,'');
 const m=code.match(/^(FP|FB)?(\d+)$/);
 return !!m&&(m[1]||'')===smPrefix&&Number(m[2])===Number(n);
}

const SM_WORKERS=["박정필", "송왕섭", "정효섭", "조귀범", "유성주", "김기환", "임영훈", "김진우", "김갑인", "문영균", "탁명환"];
const SM_SUPPORT_WORKERS=["박건우", "진성호", "조민호", "유기태", "길성현", "석동일", "이정훈", "리만훙", "이반뚱", "탄반뚜엔"];

const GAS_URL='https://script.google.com/macros/s/AKfycbxJH8OukdbBABynJG_Tgoqnmi5z-I2SWas15BWjUAYVWs30sDR8kYcO2vfQ0xxumLXm/exec';
let selectedPart='all', finishRows=[], jeRows=[], weldRows=[], scRows=[], asmRows=[], dojangRows=[],smRows=[],pressRows=[],sm2Rows=[], viewRows=[], notifyOn=false, notifyTimer=null, lastCount=0;
function localDateString(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function tomorrowDateString(){const d=new Date();d.setDate(d.getDate()+1);return localDateString(d);}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
const COPY_STORE='workResults.copyCounts.v1';
let copyMemory={};
function copyRecord(key){try{const data=JSON.parse(localStorage.getItem(COPY_STORE)||'{}');return data[key]||copyMemory[key]||{count:0,until:0};}catch(e){return copyMemory[key]||{count:0,until:0};}}
function saveCopyRecord(key,record){copyMemory[key]=record;try{const data=JSON.parse(localStorage.getItem(COPY_STORE)||'{}');data[key]=record;localStorage.setItem(COPY_STORE,JSON.stringify(data));}catch(e){showToast('복사 완료. 브라우저 저장 불가로 횟수는 현재 창에서만 유지됩니다.');}}
function updateCopyButton(btn){if(btn.dataset.copyPending==='1')return;const r=copyRecord(btn.dataset.copyKey);const waiting=r.until>Date.now();btn.disabled=waiting;btn.textContent=waiting?'복사됨':(r.count?r.count+'회 복사':'복사');btn.classList.toggle('done',r.count>0);}
setInterval(()=>document.querySelectorAll('.copyBtn[data-copy-key]').forEach(updateCopyButton),250);
async function copyText(text,btn){if(btn&&(btn.disabled||copyRecord(btn.dataset.copyKey).until>Date.now()))return;const raw=String(text||'').trim();const value=raw==='1111'?'지원작업':raw;if(!value){alert('복사할 품번이 없습니다.');return;}
 if(btn){btn.disabled=true;btn.dataset.copyPending='1';}
 try{if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(value);}catch(e){fallbackCopy(value);}}else fallbackCopy(value);
 showToast('품번 복사 완료: '+value);
 if(btn){const key=btn.dataset.copyKey,r=copyRecord(key);saveCopyRecord(key,{count:Number(r.count||0)+1,until:Date.now()+15000});}
 }catch(e){alert('복사 실패: 품번을 직접 복사하세요.');}
 finally{if(btn){delete btn.dataset.copyPending;updateCopyButton(btn);}}
}
function fallbackCopy(value){const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();try{if(!document.execCommand('copy'))throw new Error('copy failed');}finally{ta.remove();}}
function showToast(msg){const t=document.getElementById('copyToast');t.textContent=msg;t.style.display='block';clearTimeout(window.__copyToastTimer);window.__copyToastTimer=setTimeout(()=>{t.style.display='none';},1300);}
function copyBtn(value,row,field){const encoded=encodeURIComponent(String(value||''));const key=encodeURIComponent(JSON.stringify([GAS_URL,row.sheet,row.rowNo,row.inputTime,row.workDate,row.worker,field,String(value||'')]));const r=copyRecord(key),waiting=r.until>Date.now();return `<button type="button" class="copyBtn${r.count?' done':''}" data-copy-key="${key}" ${waiting?'disabled':''} onclick="copyText(decodeURIComponent('${encoded}'),this)">${waiting?'복사됨':(r.count?r.count+'회 복사':'복사')}</button>`;}
function itemCell(value,row,field='item'){return `<span class="itemCell">${copyBtn(value,row,field)}${esc(value||'')}</span>`;}
function jsonp(params,cb){const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);const s=document.createElement('script');window[callback]=data=>{cb(data);delete window[callback];s.remove();};s.onerror=()=>{alert('조회 실패: Apps Script 연결을 확인하세요.');delete window[callback];s.remove();};s.src=GAS_URL+'?'+new URLSearchParams({...params,callback}).toString();document.body.appendChild(s);}
function setTodayAndLoad(){document.getElementById('workDate').value=localDateString();loadResults(false);}
function selectPart(p){
  selectedPart=p;
  ['All','Finish','Je','Weld','Sc','Asm','Dojang','Sm','Sm2','Press'].forEach(k=>document.getElementById('btn'+k).classList.remove('active'));
  const idMap={all:'btnAll',finish:'btnFinish',je:'btnJe',weld:'btnWeld',sc:'btnSc',asm:'btnAsm',dojang:'btnDojang',press:'btnPress',sm:'btnSm',sm2:'btnSm2'};
  document.getElementById(idMap[p]).classList.add('active');
  const labelMap={all:'전체',finish:'완성파트',je:'제관파트',weld:'용접파트',sc:'SC파트',asm:'조립파트',dojang:'도장파트',press:'프레스파트',sm:'SM파트',sm2:'SM2파트'};
  document.getElementById('selectedPartLabel').textContent=labelMap[p];
  if(p==='sm'&&smViewMasterState!=='ready')loadSmViewMaster();
  buildViewRows();render();
}
let smViewMaster = [];
let smViewMasterState = 'loading';
let smViewMasterRequest = 0;
function loadSmViewMaster(){
  const request = ++smViewMasterRequest;
  smViewMasterState = 'loading';
  jsonp({action:'smMaster'},res=>{
    if(request!==smViewMasterRequest)return;
    smViewMasterState=res.ok?'ready':'error';
    smViewMaster=res.ok?(res.items||[]):[];
    if(selectedPart==='sm')renderTable();
  });
}
function smManagementLabel(r){
  if(smViewMasterState!=='ready')return smViewMasterState==='error'?'조회 실패':'조회 중';
  const norm=v=>String(v==null?'':v).trim().toUpperCase();
  const matches=smViewMaster.filter(x=>norm(x.itemNo)===norm(r.itemNo)&&(!norm(r.model)||norm(x.model)===norm(r.model))&&(!norm(r.process)||norm(x.process)===norm(r.process)));
  return [...new Set(matches.map(x=>String(x.managementNo||'').trim()).filter(Boolean))].join(' / ');
}
function loadResults(silent){
  const d=document.getElementById('workDate').value||localDateString();
  document.getElementById('workDate').value=d;
  if(!silent)document.getElementById('summary').textContent='조회 중...';
  jsonp({action:'allResults',startDate:d,endDate:d},res=>{
    if(!res.ok){document.getElementById('summary').textContent=res.message||'조회 실패';return;}
    finishRows=res.finish||[];jeRows=res.je||[];weldRows=res.weld||[];scRows=res.sc||[];asmRows=res.asm||[];
    dojangRows=res.dojang||[];pressRows=res.press||[];smRows=res.sm||[];sm2Rows=res.sm2||[];
    buildViewRows();render();if(notifyOn)checkNotify();
  });
}
function buildViewRows(){
  const f=finishRows.map(x=>{const r=x.values||[];return{sheet:'finish',rowNo:x.rowNo,rid:(x.values||[])[12]||'',kind:'완성파트',inputTime:r[0]||'',workDate:r[1]||'',worker:r[2]||'',part:r[3]||'',itemNo:r[4]||'',name:r[5]||r[4]||'',model:r[6]||'',process:r[7]||'',qty:r[8]||''};});
  const j=jeRows.map(x=>{const r=x.values||[];return{sheet:'je',rowNo:x.rowNo,rid:(x.values||[])[12]||'',kind:'제관파트',inputTime:r[0]||'',workDate:r[1]||'',worker:r[2]||'',part:'제관',hogi:r[13]||'',spec:r[14]||'',assyNo:r[15]||'',subAssyNo:r[16]||'',itemNo:r[4]||'',name:r[5]||'',model:r[6]||'',process:r[7]||'',qty:r[8]||''};});
  const w=weldRows.map(x=>{const r=x.values||[];return{sheet:'weld',rowNo:x.rowNo,rid:(x.values||[])[12]||'',kind:'용접파트',inputTime:r[0]||'',workDate:r[1]||'',worker:r[2]||'',part:r[3]||'',itemNo:r[4]||'',name:r[5]||r[4]||'',model:r[6]||'',process:r[7]||'',qty:r[8]||''};});
  const s=scRows.map(x=>{const r=x.values||[];return{sheet:'sc',rowNo:x.rowNo,rid:(x.values||[])[12]||'',kind:'SC파트',inputTime:r[0]||'',workDate:r[1]||'',worker:r[2]||'',part:r[3]||'',itemNo:r[4]||'',name:r[5]||r[4]||'',model:r[6]||'',process:r[7]||'',qty:r[8]||''};});

const ASM_LABEL_A={ECR:'A조 (ECR)',EC:'B조 (EC)'},ASM_ERP_A={'A조':'ECR','B조':'EC'};
function adminTeamName(n){n=String(n||'').trim();if(adminTeamKind==='sm2'||adminTeamKind==='dojang'){const c=n.toUpperCase().replace(/(프레임|조)$/,'');return /^[A-D]$/.test(c)?c:n;}return ASM_ERP_A[n]||n;}
function adminTeamLabel(n){if(adminTeamKind==='dojang')return /^[A-D]$/.test(n)?n+'조'+(n==='A'?' (프레임)':''):n;if(adminTeamKind==='sm2')return /^[A-D]$/.test(n)?n+'조 ('+n+'프레임)':n;return ASM_LABEL_A[n]||n;}
function adminTeamUse(k){
  if(k===adminTeamKind)return;
  const el=document.getElementById('inAsmMembers');
  adminTeamStore[adminTeamKind]={a:adminAsm,on:adminAsmTeamOn,m:el.value};
  const t=adminTeamStore[k]||{a:{teams:[],workers:[]},on:'',m:''};
  adminAsm=t.a;adminAsmTeamOn=t.on;el.value=t.m;adminTeamKind=k;admEdit=null;{const eb=document.getElementById('asmAdminEditBox');if(eb)eb.classList.add('hide');}
}
function loadAdminAsm(){
  if(adminAsm.teams.length){renderAdminAsm();return;}
  const k=adminTeamKind;
  jsonp({action:k==='sm2'?'sm2Teams':(k==='dojang'?'dojangTeams':'asmTeams')},d=>{if(d&&d.ok&&k===adminTeamKind){adminAsm={teams:(d.teams||[]).map(t=>({name:adminTeamName(t.name),members:t.members||[]})),workers:d.workers||[]};renderAdminAsm();}});
}
function asmAdminNames(){return [...new Set(document.getElementById('inAsmMembers').value.split(/[,，、]+/).map(x=>x.trim()).filter(Boolean))].sort((a,b)=>a<b?-1:a>b?1:0);}
function renderAdminAsm(){
  const canEdit=(adminTeamKind==='sm2'||adminTeamKind==='dojang');
  document.getElementById('asmAdminTeams').innerHTML=adminAsm.teams.map((t,i)=>`<button type="button" class="part ${adminAsmTeamOn===t.name?'active':''}" style="width:auto" onclick="pickAsmAdminTeam(${i})">${esc(adminTeamLabel(t.name))}</button>`).join('')+'<button type="button" class="part" style="width:auto" onclick="adminAsmTeamOn=\'\';document.getElementById(\'inAsmMembers\').value=\'\';renderAdminAsm()">해제</button>'+(canEdit?`<button type="button" class="part admSmall" onclick="toggleAdminAsmEdit()">${admEdit?'편집 닫기':'파트원 편집'}</button>`:'');
  renderAdminChips();renderAdminAsmSearch();
}
function renderAdminChips(){
  const n=asmAdminNames();
  document.getElementById('inAsmCount').textContent=n.length?'('+n.length+'명)':'';
  document.getElementById('inAsmChips').innerHTML=n.length?n.map(x=>`<span class="admChip">${esc(x)}<button type="button" aria-label="${esc(x)} 빼기" onclick="removeAsmAdminMember(${JSON.stringify(x).replace(/"/g,'&quot;')})">×</button></span>`).join(''):'<span class="sub">조를 누르거나 위 검색칸에서 이름을 검색해 추가하세요.</span>';
}
function renderAdminAsmSearch(){
  const q=document.getElementById('inAsmSearch').value.trim(),box=document.getElementById('inAsmResults'),cur=asmAdminNames();
  if(!q){box.innerHTML='';return;}
  const all=new Set(adminAsm.workers||[]);if(adminTeamKind==='dojang')((adminMaster.dojang&&adminMaster.dojang.workers)||[]).forEach(n=>all.add(n));adminAsm.teams.forEach(t=>(t.members||[]).forEach(m=>all.add(m)));
  const list=[...all].filter(n=>!cur.includes(n)&&n.includes(q)).sort().slice(0,20);
  box.innerHTML=list.length?list.map(n=>`<button type="button" class="admAdd" onclick="addAsmAdminMember(${JSON.stringify(n).replace(/"/g,'&quot;')})">+ ${esc(n)}</button>`).join(''):'<span class="sub">일치하는 이름이 없습니다.</span>';
}
function removeAsmAdminMember(n){const el=document.getElementById('inAsmMembers');el.value=asmAdminNames().filter(x=>x!==n).join(', ');renderAdminChips();renderAdminAsmSearch();}
// ---- 파트원 편집: 조 고정 인원을 바꿔 구글시트(SM2_조편성 / 도장_조편성)에 저장
let admEdit=null;
function toggleAdminAsmEdit(){const b=document.getElementById('asmAdminEditBox');if(admEdit){admEdit=null;b.classList.add('hide');renderAdminAsm();return;}admEdit=adminAsm.teams.map(t=>({name:t.name,members:(t.members||[]).slice().sort()}));b.classList.remove('hide');renderAdminAsmEdit();renderAdminAsm();}
function renderAdminAsmEdit(msg){
  const b=document.getElementById('asmAdminEditBox');if(!b||!admEdit)return;
  b.innerHTML=admEdit.map((t,i)=>`<div style="border:1px solid #cbd5e1;border-radius:8px;padding:8px;margin:6px 0;background:#fff"><b>${esc(adminTeamLabel(t.name))}</b> <span class="sub">(${t.members.length}명)</span><div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0">${t.members.length?t.members.map(n=>`<span class="admChip">${esc(n)}<button type="button" onclick="admEditRemove(${i},${JSON.stringify(n).replace(/"/g,'&quot;')})">×</button></span>`).join(''):'<span class="sub">조원 없음</span>'}</div><div style="display:flex;gap:6px;max-width:420px"><input id="admEditIn_${i}" autocomplete="off" placeholder="추가할 사람 이름"><button type="button" class="part admSmall" onclick="admEditAdd(${i})">추가</button></div></div>`).join('')+'<button type="button" onclick="admEditSave()" style="width:auto">조편성 저장</button> <span id="admEditMsg" class="sub">'+esc(msg||'')+'</span>';
}
function admEditAdd(i){const el=document.getElementById('admEditIn_'+i),n=(el.value||'').trim().replace(/[,，、]/g,'');if(!n)return;if(n.length>10)return renderAdminAsmEdit('이름이 너무 깁니다.');if(!admEdit[i].members.includes(n))admEdit[i].members=admEdit[i].members.concat([n]).sort();renderAdminAsmEdit();}
function admEditRemove(i,n){admEdit[i].members=admEdit[i].members.filter(x=>x!==n);renderAdminAsmEdit();}
function admEditSave(){
  const k=adminTeamKind,m=document.getElementById('admEditMsg');if(m)m.textContent='저장 중...';
  jsonp({action:k==='sm2'?'saveSm2Teams':'saveDojangTeams',teams:JSON.stringify(admEdit)},d=>{
    if(k!==adminTeamKind)return;
    if(d&&d.ok&&Array.isArray(d.teams)){
      adminAsm={teams:d.teams.map(t=>({name:adminTeamName(t.name),members:t.members||[]})),workers:d.workers||[]};
      if(adminAsmTeamOn&&!adminAsm.teams.some(t=>t.name===adminAsmTeamOn)){adminAsmTeamOn='';document.getElementById('inAsmMembers').value='';}
      admEdit=adminAsm.teams.map(t=>({name:t.name,members:(t.members||[]).slice().sort()}));
      renderAdminAsm();renderAdminAsmEdit('저장 완료');
    }else if(m)m.textContent=(d&&d.message)||'저장 실패';
  });
}
function pickAsmAdminTeam(i,auto){const t=adminAsm.teams[i];if(t){adminTeamAuto=!!auto;adminAsmTeamOn=t.name;document.getElementById('inAsmMembers').value=(t.members||[]).join(', ');renderAdminAsm();}}
function addAsmAdminMember(n){if(!n)return;const cur=asmAdminNames();if(!cur.includes(n))cur.push(n);document.getElementById('inAsmMembers').value=cur.join(', ');document.getElementById('inAsmSearch').value='';renderAdminChips();renderAdminAsmSearch();}
function saveAdminProc(){
  const cfgAction={weld:'saveWeld',sc:'saveSc',asm:'saveAsm',dojang:'saveDojang',press:'savePress',sm:'saveSm',sm2:'saveSm2'}[inputPart];
  const defaultPart={weld:'용접파트',sc:'SC파트',asm:'조립파트',dojang:'도장파트',press:'프레스파트',sm:'SM파트',sm2:'SM2파트'}[inputPart];
  const workDate=document.getElementById('inWorkDate').value,worker=inputPart==='asm'?adminAsmTeamOn:((inputPart==='sm2'||inputPart==='dojang')?(adminAsmTeamOn||(asmAdminNames().length===1?asmAdminNames()[0]:'')):document.getElementById('inWorker').value);
  const typed=document.getElementById('inProcItem').value.trim();
  const qty=document.getElementById('inProcQty').value;
  const msg=document.getElementById('inMsg');
  if(!workDate||!worker||!typed||!qty||Number(qty)<=0){msg.textContent=inputPart==='asm'?'작업일자/조(A조·B조)/품번(공정)/수량을 모두 입력하세요.':(inputPart==='sm2'||inputPart==='dojang'?'작업일자/조(A조, 또는 조원 1명만)/품번(공정)/수량을 모두 입력하세요.':'작업일자/작업자/품번(공정)/수량을 모두 입력하세요.');return;}
  if((inputPart==='asm'||inputPart==='sm2'||inputPart==='dojang')&&!asmAdminNames().length){msg.textContent='조원을 1명 이상 입력하세요.';return;}
  const obj=(adminMaster[inputPart].items||[]).find(x=>x.displayName===typed);
  if(!obj){msg.textContent='목록(datalist)에서 정확한 품번/공정을 선택하세요.';return;}
  jsonp({action:cfgAction,workDate,worker,part:obj.part||defaultPart,itemNo:obj.itemNo,itemName:obj.itemName,model:obj.model,process:obj.process,qty,device:'PC',memo:'',members:(inputPart==='asm'||((inputPart==='sm2'||inputPart==='dojang')&&adminAsmTeamOn))?asmAdminNames().join(', '):''},d=>{
    msg.textContent=d.ok?'저장 완료':(d.message||'저장 실패');
    if(d.ok){showAdminSaveToast();document.getElementById('inProcItem').value='';document.getElementById('inProcQty').value='';loadResults(false);}
  });
}
document.getElementById('inWorkDate').value=localDateString();
document.getElementById('workDate').value=tomorrowDateString();loadResults(false);

function setSmPrefix(prefix){smPrefix=prefix;['','FP','FB'].forEach(v=>{const b=document.getElementById('smType'+(v||'Num'));const on=v===prefix;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on?'true':'false');});renderSmAdminSearch();}
let smAdminMatches=[];
function renderSmAdminSearch(){
 document.getElementById('smAdminPartChoice').value='';
 document.getElementById('inProcItem').value='';
 const q=document.getElementById('smAdminNumber').value;
 smAdminMatches=(adminMaster.sm.items||[]).filter(x=>admShow(x)&&smMatches(x,q));
 const choice=document.getElementById('smAdminChoice');
 choice.innerHTML='<option value=""></option>'+smAdminMatches.map((x,i)=>`<option value="${i}">${esc(x.itemNo)}</option>`).join('');
 const results=document.getElementById('smAdminResults');
 if(!q){results.innerHTML='<div class="smQuickHint">관리번호를 입력하면 모델과 품번이 바로 표시됩니다.</div>';return;}
 if(!smAdminMatches.length){results.innerHTML='<div class="smQuickHint">일치하는 품목이 없습니다.</div>';return;}
 results.innerHTML=smAdminMatches.map((x,i)=>`<button type="button" class="smQuickCard" id="smQuickCard_${i}" onclick="selectSmAdminCard(${i})"><div class="smQuickModel">모델: ${esc(x.model||'-')}</div><div class="smQuickPart">품번: ${esc(x.itemNo||'-')}</div><div class="smQuickMeta">${esc(x.itemName||'')} / ${esc(x.process||'')}${x._extra?' · 추가':''}</div></button>`).join('');
 if(smAdminMatches.length===1)selectSmAdminCard(0);
}
function selectSmAdminCard(i){
 document.getElementById('smAdminPartChoice').value='';
 const item=smAdminMatches[Number(i)];
 document.getElementById('smAdminChoice').value=item?String(i):'';
 document.getElementById('inProcItem').value=item?item.displayName:'';
 document.querySelectorAll('#smAdminResults .smQuickCard').forEach((b,n)=>b.classList.toggle('active',n===Number(i)));
}
function selectSmAdminChoice(){const v=document.getElementById('smAdminChoice').value;if(v===''){document.getElementById('inProcItem').value='';return;}selectSmAdminCard(Number(v));}


let smAdminPartMatches=[];
function renderSmAdminPartSearch(){
 document.getElementById('inProcItem').value='';document.getElementById('smAdminChoice').value='';
 const q=document.getElementById('smAdminPartNumber').value.trim();
 smAdminPartMatches=(q||adminModel)?(adminMaster.sm.items||[]).filter(x=>admShow(x)&&(!q||String(x.itemNo||'').toUpperCase().includes(q.toUpperCase()))&&admModelOk(x)):[];
 if(adminModel&&adminModel!=='__none__'){const mp=adminMaster.sm.modelMap.items;smAdminPartMatches.sort((a,b)=>((mp[String(b.itemNo).trim()]||[]).includes(adminModel)?1:0)-((mp[String(a.itemNo).trim()]||[]).includes(adminModel)?1:0));}
 const total=smAdminPartMatches.length;if(total>500)smAdminPartMatches=smAdminPartMatches.slice(0,500);
 document.getElementById('smAdminPartChoice').innerHTML='<option value="">'+((q||adminModel)?(total?'모델과 품번을 확인하고 선택하세요.'+(total>500?' (500개까지만 표시, 품번을 더 입력하세요)':''):'일치하는 품목이 없습니다.'):'기종을 누르거나 품번을 입력하세요.')+'</option>'+smAdminPartMatches.map((x,i)=>`<option value="${i}">모델: ${esc(x.model||'')} / ${x.managementNo?esc(x.managementNo)+' / ':''}${esc(x.itemNo)} / ${esc(x.itemName||'')} / ${esc(x.process||'')}${x._extra?' · 추가':''}</option>`).join('');
}
function selectSmAdminPartChoice(){document.getElementById('smAdminChoice').value='';const v=document.getElementById('smAdminPartChoice').value;document.getElementById('inProcItem').value=v!==''&&smAdminPartMatches[Number(v)]?smAdminPartMatches[Number(v)].displayName:'';}

// ---- 기종 버튼(SM / SM2) + SM2 추천 조 : 폰(index.html)과 같은 규칙
function admMap(kind){return (adminMaster[kind]&&adminMaster[kind].modelMap)||{order:[],items:{},alias:{}};}
function admModelsOf(kind,x){
  const mp=admMap(kind),no=String(x.itemNo||'').trim(),mg=String(x.managementNo||'').trim();
  const a=mp.items[no]||[],b=(kind==='sm'?mp.items[mg]:null)||[];
  if(kind==='dojang')return a;   // 도장: 매핑에 적은 프레임 품번만 모델 버튼 대상
  if(kind==='sm'){if(!/앗세이|ASS'?Y/i.test(String(x.process||'')))return [];return [...new Set(a.concat(b))];}   // SM: 매핑 품번 + ERP 등록 공정만
  if(a.length||b.length)return a.concat(b);
  const m=String(x.model||'').trim();return m?[mp.alias[m]||m]:[];
}
function admShow(x){return adminExtra||!x._extra;}
function toggleAdminExtra(){adminExtra=!adminExtra;fillAdminDatalist(inputPart);}
function admModelOk(x){
  if(!adminModel||(inputPart!=='sm'&&inputPart!=='sm2'&&inputPart!=='dojang'))return true;
  const ms=admModelsOf(inputPart,x);return adminModel==='__none__'?!ms.length:ms.includes(adminModel);
}
let adminModelList=[];
function setAdminModel(i){const m=adminModelList[i];adminModel=(adminModel===m?'':m);fillAdminDatalist(inputPart);}
function renderAdminModels(){
  const box=document.getElementById('adminModelBox');if(!box)return;
  const on=(inputPart==='sm'||inputPart==='sm2'||inputPart==='dojang');
  box.classList.toggle('hide',!on);if(!on)return;
  const mp=admMap(inputPart),cnt={};let none=false;
  (adminMaster[inputPart].items||[]).filter(admShow).forEach(x=>{const ms=admModelsOf(inputPart,x);if(ms.length)ms.forEach(m=>{(cnt[m]=cnt[m]||new Set()).add(x.itemNo);});else none=true;});
  const ord=(mp.order||[]).filter(m=>cnt[m]);
  adminModelList=ord.concat(Object.keys(cnt).filter(m=>!ord.includes(m)).sort((a,b)=>cnt[b].size-cnt[a].size||(a<b?-1:1)));
  if(none&&inputPart!=='dojang'&&inputPart!=='sm')adminModelList.push('__none__');
  if(adminModel&&!adminModelList.includes(adminModel))adminModel='';
  document.getElementById('adminModels').innerHTML=adminLoaded[inputPart]?adminModelList.map((m,i)=>`<button type="button" class="part ${adminModel===m?'active':''}" style="width:100%;min-width:0;padding:10px 4px;line-height:1.2;overflow-wrap:anywhere" onclick="setAdminModel(${i})">${m==='__none__'?'모델 미지정':esc(m)}</button>`).join(''):'<span class="sub">불러오는 중...</span>';
  if(adminLoaded[inputPart]&&(inputPart==='sm2'||inputPart==='sm')&&(adminMaster[inputPart].items||[]).some(x=>x._extra))document.getElementById('adminModels').insertAdjacentHTML('beforeend',`<button type="button" class="part ${adminExtra?'active':''}" style="width:100%;grid-column:1/-1;border:2px dashed #94a3b8" onclick="toggleAdminExtra()">${adminExtra?'추가 검색 끄기':'추가 검색 (ST 없는 품번)'}</button>`);
}
function admSm2RecentMap(){
  const m={},d=String(document.getElementById('inWorkDate').value||'').replace(/\D/g,'').slice(0,8);
  (sm2Rows||[]).slice().sort((a,b)=>String((a.values||[])[0]||'').localeCompare(String((b.values||[])[0]||''))).forEach(x=>{
    const v=x.values||[],w=String(v[2]||'').trim(),no=String(v[4]||'').trim();
    if(/^[A-D]$/.test(w)&&no&&String(v[1]||'').replace(/\D/g,'').slice(0,8)===d)m[no]=w;
  });
  return m;
}
function admSm2Suggest(itemNo,model,recent){
  const no=String(itemNo||'').trim(),md=String(model||'').trim();
  recent=recent||admSm2RecentMap();
  if(recent[no])return{teams:[recent[no]],src:'최근 입력'};
  const d=(adminMaster.sm2&&adminMaster.sm2.defaults)||{},mp=admMap('sm2');
  const g=v=>String(v||'').split(',').map(x=>x.trim()).filter(x=>/^[A-D]$/.test(x));
  if(g(d[no]).length)return{teams:g(d[no]),src:'기본조(품번)'};
  if(md&&g(d[md]).length)return{teams:g(d[md]),src:'기본조(기종)'};
  const mm=(mp.items[no]||[]).concat(mp.alias[md]?[mp.alias[md]]:[]).find(k=>g(d[k]).length);
  if(mm)return{teams:g(d[mm]),src:'기본조(기종)'};
  return{teams:[],src:''};
}
function admSm2AutoTeam(){
  if(inputPart!=='sm2')return;
  const typed=document.getElementById('inProcItem').value.trim();
  const obj=(adminMaster.sm2.items||[]).find(x=>x.displayName===typed);
  if(!obj)return;
  const r=admSm2Suggest(obj.itemNo,obj.model);
  if(r.teams.length!==1||(adminAsmTeamOn&&!adminTeamAuto))return;
  const i=adminAsm.teams.findIndex(t=>t.name===r.teams[0]);
  if(i<0||adminAsmTeamOn===r.teams[0])return;
  pickAsmAdminTeam(i,true);
  document.getElementById('inMsg').textContent=r.teams[0]+'조 자동 선택 (추천: '+r.src+') — 다르면 조 버튼을 누르세요.';
}
document.getElementById('inProcItem').addEventListener('input',admSm2AutoTeam);
document.getElementById('inProcItem').addEventListener('change',admSm2AutoTeam);
</script>
