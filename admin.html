<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>작업실적 조회</title>
  <style>body{font-family:Arial,'Noto Sans KR',sans-serif;margin:0;background:#f5f6f8;color:#111}header{background:#111827;color:#fff;padding:16px 18px;font-size:22px;font-weight:800}.wrap{padding:14px;max-width:1180px;margin:0 auto}.box{background:#fff;padding:14px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}label{font-size:14px;font-weight:800;display:block;margin-bottom:6px}input[type=date]{font-size:18px;padding:10px;border:1px solid #bbb;border-radius:10px;width:210px;max-width:100%;box-sizing:border-box}button{font-size:16px;padding:11px 14px;margin:4px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer}button.gray{background:#555}button.off{background:#888}button.part{background:#e5e7eb;color:#111;border:1px solid #cbd5e1}button.part.active{background:#111827;color:#fff;border-color:#111827}button.del{background:#dc2626;color:#fff;padding:8px 10px;font-size:14px;border-radius:8px}button.del:disabled{background:#999;cursor:not-allowed}.row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.muted{color:#666;font-size:13px;margin-top:8px;line-height:1.45}.partBox{display:flex;gap:6px;flex-wrap:wrap}.partTitle{font-size:15px;font-weight:800;margin-bottom:4px}table{width:100%;border-collapse:collapse;background:#fff;font-size:15px}th,td{border:1px solid #ddd;padding:10px;text-align:left;white-space:nowrap}th{background:#eee;font-weight:800}td.qty{text-align:right;font-weight:800}.tableWrap{overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}.summary{font-size:17px;font-weight:800}.empty{padding:18px;text-align:center;color:#666;background:#fff}.pill{display:inline-block;background:#eef2ff;color:#111827;border:1px solid #c7d2fe;border-radius:999px;padding:4px 10px;margin-left:6px;font-size:14px}.subBox{display:flex;gap:8px;flex-wrap:wrap}.subCard{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:9px 12px;font-weight:800}.subCard small{display:block;color:#555;font-weight:600;margin-top:3px}</style>
</head>
<body><header>작업실적 조회</header><div class="wrap"><div class="box"><div class="row"><div><label for="workDate">조회일자</label><input id="workDate" type="date"></div><button type="button" onclick="loadResults(false)">조회</button><button type="button" class="gray" onclick="setTodayAndLoad()">오늘</button><button type="button" onclick="downloadCsv()">CSV 다운로드</button><button type="button" id="notifyBtn" class="off" onclick="toggleNotify()">PC 알림 켜기</button></div><div class="muted">날짜 선택 후 카테고리를 클릭하면 해당 실적만 표시됩니다. 잘못 입력한 건 PC 화면에서도 삭제할 수 있습니다.</div></div><div class="box"><div class="partTitle">카테고리 <span id="selectedPartLabel" class="pill">전체</span></div><div class="partBox"><button type="button" id="btnAll" class="part active" onclick="selectPart('all')">전체</button><button type="button" id="btnFinish" class="part" onclick="selectPart('finish')">완성파트</button><button type="button" id="btnJe" class="part" onclick="selectPart('je')">제관파트</button></div></div><div id="jeSummaryBox" class="box" style="display:none"><div class="partTitle">제관 SUB ASSY별 수량</div><div id="jeSubSummary" class="subBox"></div></div><div id="summary" class="box summary">조회 대기</div><div class="tableWrap"><table id="tbl"></table></div></div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxJH8OukdbBABynJG_Tgoqnmi5z-I2SWas15BWjUAYVWs30sDR8kYcO2vfQ0xxumLXm/exec';
let selectedPart='all', finishRows=[], jeRows=[], viewRows=[], notifyOn=false,lastKey='',timer=null;
function localDateString(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}function jsonp(params,cb){const callback='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);const s=document.createElement('script');window[callback]=data=>{cb(data);delete window[callback];s.remove();};s.onerror=()=>{alert('조회 실패: Apps Script 연결을 확인하세요.');delete window[callback];s.remove();};s.src=GAS_URL+'?'+new URLSearchParams({...params,callback}).toString();document.body.appendChild(s);}function setTodayAndLoad(){document.getElementById('workDate').value=localDateString();loadResults(false);}function selectPart(p){selectedPart=p;['All','Finish','Je'].forEach(k=>document.getElementById('btn'+k).classList.remove('active'));document.getElementById(p==='all'?'btnAll':p==='finish'?'btnFinish':'btnJe').classList.add('active');document.getElementById('selectedPartLabel').textContent=p==='all'?'전체':p==='finish'?'완성파트':'제관파트';buildViewRows();render();}
function loadResults(silent){const d=document.getElementById('workDate').value;if(!d){alert('조회일자를 선택하세요.');return;}if(!silent)document.getElementById('summary').textContent='조회 중...';let got=0, oldKey=lastKey;function done(){got++;if(got<2)return;buildViewRows();lastKey=makeKey(viewRows);render();if(silent&&notifyOn&&oldKey&&oldKey!==lastKey){const latest=viewRows[0]||{};showPcNotice('작업실적 입력 확인',`${latest.worker||''} / ${latest.name||''} / ${latest.qty||''}개`);}}jsonp({action:'results',startDate:d,endDate:d},res=>{finishRows=res.ok?(res.rows||[]):[];done();});jsonp({action:'jeResults',startDate:d,endDate:d},res=>{jeRows=res.ok?(res.rows||[]):[];done();});}
function buildViewRows(){const f=finishRows.map(x=>{const r=x.values||[];return{sheet:'finish',rowNo:x.rowNo,kind:'완성파트',inputTime:r[0]||'',workDate:r[1]||'',worker:r[2]||'',part:r[3]||'',itemNo:r[4]||'',name:r[5]||r[4]||'',qty:r[8]||''};});const j=jeRows.map(x=>{const r=x.values||[];return{sheet:'je',rowNo:x.rowNo,kind:'제관파트',inputTime:r[0]||'',workDate:r[1]||'',worker:r[2]||'',part:'제관',hogi:r[4]||'',spec:r[5]||'',assyNo:r[6]||'',subAssyNo:r[7]||'',name:r[5]||'',qty:r[8]||''};});let all=[];if(selectedPart==='all')all=f.concat(j);else if(selectedPart==='finish')all=f;else all=j;viewRows=all.filter(x=>x.inputTime||x.worker||x.name||x.qty).sort((a,b)=>String(b.inputTime).localeCompare(String(a.inputTime)));}
function render(){const d=document.getElementById('workDate').value,total=viewRows.reduce((s,r)=>s+Number(r.qty||0),0);document.getElementById('summary').innerHTML=`${esc(d)} / ${esc(document.getElementById('selectedPartLabel').textContent)} 조회 건수: <b>${viewRows.length}</b>건 / 수량 합계: <b>${total}</b>`;renderJeSummary();let headers;if(selectedPart==='je')headers=['입력일시','작업자','호기수','사양','ASSY 품번','SUB ASSY 품번','수량','삭제'];else if(selectedPart==='finish')headers=['입력일시','작업자','품번','품명','수량','삭제'];else headers=['입력일시','구분','작업자','호기수','품번/ASSY','품명/사양','SUB ASSY 품번','수량','삭제'];let head='<tr>'+headers.map(h=>`<th>${h}</th>`).join('')+'</tr>';if(!viewRows.length){document.getElementById('tbl').innerHTML=head+`<tr><td colspan="${headers.length}" class="empty">조회된 입력 실적이 없습니다.</td></tr>`;return;}document.getElementById('tbl').innerHTML=head+viewRows.map(r=>rowHtml(r)).join('');}
function delBtn(r){return `<button type="button" class="del" onclick="deleteRow('${esc(r.sheet)}',${Number(r.rowNo||0)})">삭제</button>`;}function rowHtml(r){if(selectedPart==='je')return `<tr><td>${esc(r.inputTime)}</td><td>${esc(r.worker)}</td><td>${esc(r.hogi)}</td><td>${esc(r.spec)}</td><td>${esc(r.assyNo)}</td><td>${esc(r.subAssyNo||'-')}</td><td class="qty">${esc(r.qty)}</td><td>${delBtn(r)}</td></tr>`;if(selectedPart==='finish')return `<tr><td>${esc(r.inputTime)}</td><td>${esc(r.worker)}</td><td>${esc(r.itemNo||'')}</td><td>${esc(r.name)}</td><td class="qty">${esc(r.qty)}</td><td>${delBtn(r)}</td></tr>`;return `<tr><td>${esc(r.inputTime)}</td><td>${esc(r.kind)}</td><td>${esc(r.worker)}</td><td>${esc(r.kind==='제관파트'?r.hogi:'')}</td><td>${esc(r.kind==='제관파트'?r.assyNo:(r.itemNo||''))}</td><td>${esc(r.kind==='제관파트'?r.spec:r.name)}</td><td>${esc(r.subAssyNo||'')}</td><td class="qty">${esc(r.qty)}</td><td>${delBtn(r)}</td></tr>`;}function deleteRow(sheet,rowNo){if(!rowNo){alert('삭제할 행 정보를 찾지 못했습니다.');return;}if(!confirm('선택한 실적을 삭제 처리할까요?'))return;jsonp({action:'delete',sheet,rowNo},res=>{if(!res.ok){alert(res.message||'삭제 실패');return;}loadResults(false);});}
function renderJeSummary(){const box=document.getElementById('jeSummaryBox');if(selectedPart!=='je'){box.style.display='none';return;}box.style.display='block';const map={};viewRows.forEach(r=>{const k=r.subAssyNo||'SUB 없음';map[k]=(map[k]||0)+Number(r.qty||0);});document.getElementById('jeSubSummary').innerHTML=Object.keys(map).sort().map(k=>`<div class="subCard">${esc(k)}<small>${map[k].toLocaleString()}개</small></div>`).join('')||'<div class="muted">집계 없음</div>';}
function makeKey(list){return list.map(r=>[r.inputTime,r.kind,r.worker,r.hogi,r.name,r.assyNo,r.subAssyNo,r.qty].join('|')).join('\n');}
function downloadCsv(){const headers=selectedPart==='je'?['입력일시','작업자','호기수','사양','ASSY 품번','SUB ASSY 품번','수량']:selectedPart==='finish'?['입력일시','작업자','품번','품명','수량']:['입력일시','구분','작업자','호기수','품번/ASSY','품명/사양','SUB ASSY 품번','수량'];const rows=viewRows.map(r=>selectedPart==='je'?[r.inputTime,r.worker,r.hogi,r.spec,r.assyNo,r.subAssyNo,r.qty]:selectedPart==='finish'?[r.inputTime,r.worker,r.itemNo||'',r.name,r.qty]:[r.inputTime,r.kind,r.worker,r.kind==='제관파트'?r.hogi:'',r.kind==='제관파트'?r.assyNo:(r.itemNo||''),r.kind==='제관파트'?r.spec:r.name,r.subAssyNo||'',r.qty]);const csv=[headers,...rows].map(row=>row.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='작업실적_'+(document.getElementById('workDate').value||localDateString())+'_'+document.getElementById('selectedPartLabel').textContent+'.csv';a.click();URL.revokeObjectURL(a.href);}
async function toggleNotify(){const btn=document.getElementById('notifyBtn');if(!('Notification'in window)){alert('이 브라우저는 PC 알림을 지원하지 않습니다.');return;}if(!notifyOn){const perm=await Notification.requestPermission();if(perm!=='granted'){alert('브라우저 알림 허용이 필요합니다.');return;}notifyOn=true;btn.textContent='PC 알림 켜짐';btn.classList.remove('off');loadResults(true);timer=setInterval(()=>loadResults(true),30000);}else{notifyOn=false;btn.textContent='PC 알림 켜기';btn.classList.add('off');if(timer)clearInterval(timer);timer=null;}}function showPcNotice(title,body){try{new Notification(title,{body});}catch(e){}}
document.getElementById('workDate').value=localDateString();loadResults(false);
</script></body></html>
